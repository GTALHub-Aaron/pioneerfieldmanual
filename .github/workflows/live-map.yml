name: Live map sync
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-map
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/satsync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the newest save from the server
        env:
          SF_HOST: ${{ secrets.SF_HOST }}
          SF_TOKEN: ${{ secrets.SF_TOKEN }}
          SF_ADMIN_PASSWORD: ${{ secrets.SF_ADMIN_PASSWORD }}
        run: python tools/satsync/fetch_save.py "$RUNNER_TEMP/server.sav"
      - name: Build the map layer
        run: |
          mkdir -p out
          python tools/satsync/extract.py "$RUNNER_TEMP/server.sav" out/live.json
      - name: Upload the snapshot (private, via the sync-map function)
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl -fsS -X POST "https://hjwuluhdiczmssldyeus.supabase.co/functions/v1/sync-map?upload=1" \
            -H "x-sync-secret: $SYNC_SECRET" -H "Content-Type: application/json" \
            --data-binary @out/live.json
